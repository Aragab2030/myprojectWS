<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Qatar Portal</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <!-- Qatar Branding Header -->
            <div class="brand-header">
                <div class="qatar-flag-stripe"></div>
                <div class="logo-section">
                    <h1 class="brand-title">Qatar Portal</h1>
                    <p class="brand-subtitle">مرحباً بكم | Welcome</p>
                </div>
            </div>

            <!-- Login Form -->
            <div class="login-form-container">
                <h2 class="form-title">Sign In</h2>
                <p class="form-subtitle">Enter your credentials to access your account</p>
                
                <form id="loginForm" class="login-form" method="post" action="#LOGIN#">
                    <input type="hidden" name="p_request" value="#REQUEST#">
                    <input type="hidden" name="p_instance" value="#INSTANCE#">
                    <input type="hidden" name="p_flow_id" value="#FLOW_ID#">
                    <input type="hidden" name="p_flow_step_id" value="#FLOW_STEP_ID#">
                    <input type="hidden" name="p_page_id" value="#PAGE_ID#">
                    <input type="hidden" name="p_arg_names" value="#ARG_NAMES#">
                    <input type="hidden" name="p_arg_values" value="#ARG_VALUES#">
                    <input type="hidden" name="p_item_names" value="#ITEM_NAMES#">
                    <input type="hidden" name="p_item_values" value="#ITEM_VALUES#">
                    
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input 
                                type="text" 
                                id="username" 
                                name="p_t01" 
                                class="form-input" 
                                placeholder="Enter your username" 
                                autocomplete="username"
                                required
                                autofocus
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input 
                                type="password" 
                                id="password" 
                                name="p_t02" 
                                class="form-input" 
                                placeholder="Enter your password" 
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="p_remember_me" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#FORGOT_PASSWORD_URL#" class="forgot-password-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-button" id="loginButton">
                        <span>Sign In</span>
                        <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </form>

                <!-- Error Message Display -->
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>&copy; 2024 Qatar Portal. All rights reserved.</p>
                <p class="footer-links">
                    <a href="#PRIVACY_URL#">Privacy Policy</a> | 
                    <a href="#TERMS_URL#">Terms of Service</a>
                </p>
            </div>
        </div>

        <!-- Background Pattern -->
        <div class="background-pattern"></div>
    </div>

    <script src="login.js"></script>
</body>
</html>
