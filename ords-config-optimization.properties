# ORDS Configuration Optimizations for Oracle APEX Page Designer Performance
# Place this configuration in your ORDS config directory or merge with existing settings

# Connection Pool Settings - Optimize for Page Designer workload
# Increase pool size for concurrent Page Designer sessions
db.connectionType=basic
db.poolIncrement=5
db.maxConnectionReuseCount=14400
db.initialPoolSize=10
db.minPoolSize=5
db.maxPoolSize=50

# Statement Cache - Reduce SQL parsing overhead
jdbc.MaxStatements=100
jdbc.MaxStatementsPerConnection=10

# Connection Timeout Settings
db.connectionWaitTimeout=300
db.inactiveConnectionTimeout=1800

# Security Settings - Balance security with performance
security.requestValidationFunction=null
security.httpsHeaderCheck=false

# Compression - Enable for faster response times
server.compressResponse=true
server.compressionThreshold=2048

# Caching Headers - Improve browser caching
server.defaultPageCacheControl=private, max-age=3600
server.defaultStaticFileCacheControl=public, max-age=86400

# Session Timeout - Prevent unnecessary reconnections
session.timeout=3600
session.maxAge=7200

# Database URL Configuration
# Ensure using service name instead of SID for better connection pooling
# Example: jdbc:oracle:thin:@//hostname:1521/SERVICENAME

# ORDS Standalone Configuration (if using standalone mode)
# server.httpPort=8080
# server.httpsPort=8443
# server.ajp.enabled=false

# Logging - Reduce logging overhead in production
logging.level.root=WARN
logging.level.oracle.ords=INFO
logging.level.oracle.dbtools.common.config.log=WARN

# Thread Pool Configuration
server.threadPoolSize=200
server.maxRequestSize=52428800

# Idle Timeout
server.idleTimeout=60000

# HTTP/2 Support (if available)
server.http2Enabled=true
