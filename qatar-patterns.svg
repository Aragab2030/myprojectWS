<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Qatar Brand Colors -->
        <linearGradient id="qatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8B1538;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6B0F2A;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F4D03F;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
        </linearGradient>
        
        <!-- Islamic Geometric Pattern -->
        <pattern id="islamicPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="none"/>
            <path d="M50 10 L60 30 L80 30 L65 42 L70 60 L50 48 L30 60 L35 42 L20 30 L40 30 Z" 
                  fill="url(#goldGradient)" opacity="0.3"/>
            <circle cx="50" cy="50" r="5" fill="url(#goldGradient)" opacity="0.5"/>
        </pattern>
        
        <!-- Arabic Calligraphy Style Pattern -->
        <pattern id="arabicPattern" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse">
            <path d="M10 75 Q40 50, 70 75 T130 75" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.4"/>
            <path d="M20 100 Q50 80, 80 100 T140 100" stroke="url(#goldGradient)" stroke-width="1.5" fill="none" opacity="0.3"/>
        </pattern>
    </defs>
    
    <!-- Background -->
    <rect width="800" height="600" fill="url(#qatarGradient)"/>
    
    <!-- Decorative Patterns -->
    <rect width="800" height="600" fill="url(#islamicPattern)" opacity="0.3"/>
    <rect width="800" height="600" fill="url(#arabicPattern)" opacity="0.2"/>
    
    <!-- Geometric Elements -->
    <g opacity="0.1">
        <circle cx="700" cy="100" r="80" fill="white"/>
        <circle cx="100" cy="500" r="60" fill="white"/>
        <circle cx="650" cy="450" r="100" fill="white"/>
    </g>
    
    <!-- Qatar-inspired ornamental corners -->
    <g opacity="0.15">
        <!-- Top Left -->
        <path d="M0 0 L100 0 L50 50 Z" fill="url(#goldGradient)"/>
        <circle cx="75" cy="25" r="15" fill="white"/>
        
        <!-- Top Right -->
        <path d="M800 0 L700 0 L750 50 Z" fill="url(#goldGradient)"/>
        <circle cx="725" cy="25" r="15" fill="white"/>
        
        <!-- Bottom Left -->
        <path d="M0 600 L100 600 L50 550 Z" fill="url(#goldGradient)"/>
        <circle cx="75" cy="575" r="15" fill="white"/>
        
        <!-- Bottom Right -->
        <path d="M800 600 L700 600 L750 550 Z" fill="url(#goldGradient)"/>
        <circle cx="725" cy="575" r="15" fill="white"/>
    </g>
</svg>
