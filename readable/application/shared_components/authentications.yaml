- # ====== Authentication: OCI IAM Authentication Scheme =======
  id: 8575124164152661
  identification: 
    name: OCI IAM Authentication Scheme

  subscription: 
    version-number: 38929465570457

  settings: 
    type: Social Sign-In
    credential-store: 8574692539302387
    authentication-provider: OpenID Connect Provider
    discovery-url: 'https://idcs-cb5aa99a0f5e460e9d29112551fa4757.identity.oraclecloud.com:443/.well-known/openid-configuration'
    scope: profile,groups
    username: sub
    convert-username-to-upper-case: false
    additional-user-attributes: groups
    verify-attributes: true

  source: 
    pl/sql-code: |
      procedure load_dynamic_groups as
        l_group_names apex_t_varchar2;
      begin
        --
        -- add all group names to l_group_names
        --
        for i in 1 .. apex_json.get_count('groups') loop
            apex_string.push (
              p_table => l_group_names,
              p_value => apex_json.get_varchar2 (
                             p_path => 'groups[%d].name',
                             p0     => i ));
        end loop;
        --
        -- save group names in session
        --
        apex_authorization.enable_dynamic_groups (
            p_group_names => l_group_names );
      end;

  session-not-valid: 
    redirect-to: Login Page

  login-processing: 
    post-authentication-procedure-name: load_dynamic_groups
    switch-in-session: false

  post-logout-url: 
